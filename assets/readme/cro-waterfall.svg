<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">The CRO waterfall in Hormozi offer creation</title>
<desc id="desc">Offer and commercial approval upstream, sales assets, automatic CRO gate, and downstream structural QA. CRO findings feed back to the affected upstream stage only with owner approval.</desc>
<defs><linearGradient id="back" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08192e"/><stop offset="1" stop-color="#18416a"/></linearGradient></defs>
<rect width="1200" height="360" rx="22" fill="url(#back)"/>
<text x="45" y="56" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#ffffff">Offer to conversion: one continuous waterfall</text>
<text x="45" y="89" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#bcd2e5">CRO is checked by default in full offer runs, even when nobody asks for CRO.</text>
<g font-family="Arial,Helvetica,sans-serif">
 <rect x="45" y="130" width="228" height="123" rx="14" fill="#214461" stroke="#6c8caf"/>
 <text x="65" y="162" fill="#ffa94f" font-size="18" font-weight="700">01  UPSTREAM</text>
 <text x="65" y="196" fill="#ffffff" font-size="24" font-weight="700">Offer + pricing</text>
 <text x="65" y="224" fill="#d1e1ed" font-size="17">Owner decisions</text>
 <rect x="332" y="130" width="228" height="123" rx="14" fill="#214461" stroke="#6c8caf"/>
 <text x="352" y="162" fill="#4dd7c2" font-size="18" font-weight="700">02  SALES</text>
 <text x="352" y="196" fill="#ffffff" font-size="24" font-weight="700">Sales drafts</text>
 <text x="352" y="224" fill="#d1e1ed" font-size="17">Landing / pitch / hooks</text>
 <rect x="619" y="119" width="228" height="145" rx="14" fill="#3d392d" stroke="#ffa94f" stroke-width="2"/>
 <text x="639" y="153" fill="#ffa94f" font-size="18" font-weight="700">03  AUTO CRO GATE</text>
 <text x="639" y="189" fill="#ffffff" font-size="24" font-weight="700">Fix or test?</text>
 <text x="639" y="220" fill="#f5d2a5" font-size="16">Evidence + UX + SEO</text>
 <text x="639" y="241" fill="#f5d2a5" font-size="16">Readiness if no page</text>
 <rect x="906" y="130" width="248" height="123" rx="14" fill="#214461" stroke="#6c8caf"/>
 <text x="926" y="162" fill="#4dd7c2" font-size="18" font-weight="700">04  DOWNSTREAM</text>
 <text x="926" y="196" fill="#ffffff" font-size="24" font-weight="700">QA + summary</text>
 <text x="926" y="224" fill="#d1e1ed" font-size="17">Keep all existing holds</text>
</g>
<g stroke="#f9a24a" stroke-width="4" stroke-linecap="round" fill="none">
 <path d="M278 191 L320 191"/><path d="M309 183 L320 191 L309 199"/>
 <path d="M565 191 L608 191"/><path d="M597 183 L608 191 L597 199"/>
 <path d="M852 191 L895 191"/><path d="M884 183 L895 191 L884 199"/>
 <path d="M733 267 L733 298 L170 298 L170 259"/>
 <path d="M162 272 L170 259 L178 272"/>
</g>
<text x="290" y="331" font-family="Arial,Helvetica,sans-serif" fill="#d3e1ec" font-size="17">CRO feedback to affected upstream work requires owner approval and revalidation.</text>
</svg>